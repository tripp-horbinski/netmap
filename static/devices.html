<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hazel · devices</title>
<link rel="icon" href="/hazel.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>try{const t=localStorage.getItem('nm-theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  .list li.row { grid-template-columns: 1fr 72px 52px; }
  .list svg.spark { width: 72px; height: 22px; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head form { margin-left: auto; }
  .tiles { margin: 16px 0; max-width: 760px; }
</style>
</head>
<body>
<header id="nav"></header>
<div class="shell">
<aside>
  <h1>Devices</h1>
  <div class="sub">Who on the LAN asked the resolver what</div>
  <div class="seg wide" id="window">
    <button data-w="1h">1h</button><button data-w="24h">24h</button>
    <button data-w="7d">7d</button><button data-w="all">All</button>
  </div>
  <h2>Devices <span class="muted" id="count"></span></h2>
  <ul class="list" id="devices"><li class="muted">Loading…</li></ul>
  <p class="muted" id="hint">Devices appear here once they use this Mac as DNS.
     Name them by clicking a row.</p>
</aside>
<main id="main"><div class="empty">Pick a device.</div></main>
</div>

<script>
const { esc, fmtN, ago, when, spark, rows } = nm;
const $ = (id) => document.getElementById(id);
const state = { win: '24h', ip: null, list: null, detail: null };
nm.nav('/devices');
nm.stream();

function renderList() {
  const { devices, window: win } = state.list;
  $('count').textContent = devices.length ? `(${devices.length})` : '';
  $('hint').style.display = devices.length > 1 ? 'none' : '';
  $('hint').innerHTML = `Devices appear here once they use this Mac${state.list.lan_ip ? ` (<b>${esc(state.list.lan_ip)}</b>)` : ''} as their DNS server. Name them by clicking a row.`;
  if (!devices.length) { $('devices').innerHTML = '<li class="muted">No devices yet. Is <code>netlog resolve</code> running?</li>'; return; }
  $('devices').innerHTML = devices.map((d) => `
    <li class="row${d.ip === state.ip ? ' sel' : ''}" data-ip="${esc(d.ip)}">
      <div class="name" title="${esc(d.ip)}">${esc(d.device)}<small>${esc(d.ip === d.device ? ago(d.last_seen) : d.ip + ' · ' + ago(d.last_seen))}</small></div>
      ${spark(d.bins, win)}
      <div class="n${d.tracker_lookups ? ' warn' : ''}" title="${fmtN(d.tracker_lookups)} tracker lookups">${fmtN(d.lookups)}</div>
    </li>`).join('');
  for (const li of $('devices').querySelectorAll('li.row')) li.onclick = () => select(li.dataset.ip);
}

const tracker = (r) => (r.tracker ? '<span class="tag">tracker</span>' : '');

// 7 x 24 heatmap, Monday first; cell opacity scales with the square root so a single busy hour
// does not wash out the rest. Every cell carries its count for hover.
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function heatmap(heat) {
  const max = Math.max(1, ...heat.flat());
  const order = [1, 2, 3, 4, 5, 6, 0];
  if (!heat.flat().some(Boolean)) return '<div class="muted">No lookups in this window.</div>';
  const rowsHtml = order.map((d) => `<div class="d">${DAYS[d]}</div><div class="cells">${heat[d].map((n, h) =>
    `<div class="c${n ? '' : ' z'}" style="--o:${n ? (0.12 + 0.88 * Math.sqrt(n / max)).toFixed(3) : 0}" title="${DAYS[d]} ${h}:00–${h + 1}:00 · ${fmtN(n)} lookups"></div>`).join('')}</div>`).join('');
  const hours = Array.from({ length: 24 }, (_, h) => `<span>${h}</span>`).join('');
  return `<div class="heat">${rowsHtml}<div class="hours">${hours}</div></div>
    <div class="heat-legend"><span>fewer</span><i style="opacity:.12"></i><i style="opacity:.4"></i><i style="opacity:.7"></i><i></i><span>more · peak ${fmtN(max)} in an hour</span></div>`;
}

function renderDetail() {
  const d = state.detail;
  if (!d) { $('main').innerHTML = '<div class="empty">Pick a device.</div>'; return; }
  const dev = d.device, win = d.window;
  const pct = dev.lookups ? Math.round((100 * dev.tracker_lookups) / dev.lookups) : 0;
  $('main').innerHTML = `
    <div class="head">
      <div><h3>${esc(dev.device)} <span class="muted">${esc(dev.ip)}${dev.mac ? ' · ' + esc(dev.mac) : ''}</span></h3>
      <div class="muted">first seen ${when(dev.first_seen)} · last ${ago(dev.last_seen)}</div></div>
      <form id="rename" class="inline"><input id="label" placeholder="Name this device (blank to clear)" value="${esc(dev.label ?? '')}"><button class="btn">Save</button></form>
    </div>
    <div class="tiles">
      <div class="tile"><div class="label">Lookups</div><div class="value">${fmtN(dev.lookups)}</div></div>
      <div class="tile"><div class="label">Domains</div><div class="value">${fmtN(dev.domains)}</div></div>
      <div class="tile"><div class="label">Tracker lookups</div><div class="value${dev.tracker_lookups ? ' warn' : ''}">${fmtN(dev.tracker_lookups)}</div><div class="sub muted">${pct}% of lookups</div><div class="meter"><i style="width:${pct}%"></i></div></div>
      <div class="tile"><div class="label">New names</div><div class="value">${fmtN(d.new_names.length)}</div><div class="sub muted">never asked before</div></div>
    </div>
    <h2>Lookups over time</h2>
    <div class="chart">${spark(dev.bins, win)}<div class="axis"><span>${when(win.start)}</span><span>now</span></div></div>
    <h2>By weekday and hour <span class="muted">local time, this window</span></h2>
    ${heatmap(d.heat)}
    <h2>Domains</h2>
    ${rows(d.domains.slice(0, 60), [
      { h: 'domain', f: (r) => esc(r.domain) + tracker(r) },
      { h: 'hosts', n: true, f: (r) => fmtN(r.hosts) },
      { h: 'lookups', n: true, f: (r) => fmtN(r.lookups) },
      { h: 'last', n: true, f: (r) => ago(r.last) },
    ], 'No lookups in this window.')}
    <h2>Trackers</h2>
    ${rows(d.trackers.slice(0, 40), [
      { h: 'name', f: (r) => esc(r.qname) },
      { h: 'lookups', n: true, f: (r) => fmtN(r.lookups) },
      { h: 'last', n: true, f: (r) => ago(r.last) },
    ], 'No known tracking domains. The list is netlog’s built-in one, so this is a floor, not proof of innocence.')}
    <h2>New names <span class="muted">never looked up before this window</span></h2>
    ${rows(d.new_names.slice(0, 60), [
      { h: 'name', f: (r) => esc(r.qname) + tracker(r) },
      { h: 'first', n: true, f: (r) => when(r.first) },
      { h: 'lookups', n: true, f: (r) => fmtN(r.lookups) },
    ], win.since > 0 ? 'Nothing new.' : 'Pick a time window to see what is new.')}`;
  $('rename').onsubmit = async (e) => {
    e.preventDefault();
    await fetch(`/api/devices/${encodeURIComponent(dev.ip)}/name`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label: $('label').value }),
    });
    await refresh();
  };
}

async function select(ip) {
  state.ip = ip;
  history.replaceState(null, '', `#${encodeURIComponent(ip)}`);
  await refresh();
}

async function refresh() {
  const q = `since=${encodeURIComponent(state.win)}`;
  const [list, detail] = await Promise.all([
    fetch(`/api/devices?${q}`).then((r) => r.json()),
    state.ip ? fetch(`/api/devices/${encodeURIComponent(state.ip)}?${q}`).then((r) => (r.ok ? r.json() : null)) : null,
  ]);
  state.list = list; state.detail = detail;
  renderList(); renderDetail();
}

nm.segment($('window'), state.win, (w) => { state.win = w; refresh(); });
state.ip = decodeURIComponent(location.hash.slice(1)) || null;
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
