<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hazel · site traces</title>
<link rel="icon" href="/hazel.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>try{const t=localStorage.getItem('nm-theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  .list li.row { grid-template-columns: 1fr 40px 40px; }
  input.filter { margin-top: 10px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tiles { margin: 16px 0; max-width: 760px; }
  /* waterfall: one row per host, a bar from 0 to its offset within the load */
  .wf { max-width: 860px; margin-top: 6px; }
  .wf .r { display: grid; grid-template-columns: 280px 1fr 56px; align-items: center; gap: 10px; padding: 2px 4px; border-radius: 4px; }
  .wf .r:hover { background: var(--panel-2); }
  .wf .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf .h small { color: var(--dim); margin-left: 6px; }
  .wf .track { position: relative; height: 10px; }
  .wf .bar { position: absolute; left: 0; top: 1px; height: 8px; border-radius: 4px; background: var(--accent); min-width: 3px; }
  .wf .bar.t { background: var(--warn); }
  .wf .bar.fp { background: var(--text); }
  .wf .ms { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 11px; margin: 6px 0 2px; }
  .legend i { display: inline-block; width: 10px; height: 8px; border-radius: 4px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header id="nav"></header>
<div class="shell">
<aside>
  <h1>Site traces</h1>
  <div class="sub">What loading a site pulls in</div>
  <div class="seg wide" id="window">
    <button data-w="1h">1h</button><button data-w="24h">24h</button>
    <button data-w="7d">7d</button><button data-w="all">All</button>
  </div>
  <input class="filter" id="filter" type="search" placeholder="Filter sites…">
  <h2>Sites <span class="muted" id="count"></span></h2>
  <p class="muted" id="ext" style="display:none"></p>
  <ul class="list" id="sites"><li class="muted">Loading…</li></ul>
</aside>
<main id="main"><div class="empty">Pick a site.</div></main>
</div>

<script>
const { esc, fmtN, ago, ms, rows } = nm;
const when = (ts) => nm.when(ts, true);
const $ = (id) => document.getElementById(id);
const state = { win: '24h', site: null, list: [], detail: null, q: '', graph: null, table: false, load: null, loadStart: null, card: null };
const CLASSES = [['first-party', 'first party'], ['update', 'update check'], ['telemetry', 'telemetry'], ['ads', 'ads & tracking'], ['cdn', 'CDN / cloud'], ['other', 'other']];
const fmtBytes = (b) => (b == null ? '' : b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : b >= 1024 ? `${Math.round(b / 1024)} KB` : `${b} B`);
nm.nav('/sites');
nm.stream();

function showExt(st) {
  const el = $('ext');
  el.style.display = '';
  el.innerHTML = st.rows
    ? `Chrome extension: ${fmtN(st.rows)} requests reported, last ${ago(st.last)}. Its loads are marked <span class="tag fp">exact</span>.`
    : 'Chrome attribution here is a heuristic. For exact per-tab traces, load <code>extension/</code> at chrome://extensions.';
}

function renderList() {
  const q = state.q.toLowerCase();
  const list = state.list.filter((s) => !q || s.site.includes(q) || s.label.includes(q));
  $('count').textContent = list.length ? `(${list.length})` : '';
  if (!list.length) { $('sites').innerHTML = '<li class="muted">No loads in this window.</li>'; return; }
  $('sites').innerHTML = list.map((s) => `
    <li class="row${s.site === state.site ? ' sel' : ''}" data-site="${esc(s.site)}">
      <div class="name" title="${esc(s.site)}${s.exact ? ' · exact (Chrome extension)' : ''}">${esc(s.label)}<small>${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'} · ${ago(s.last)}${s.exact ? ' · exact' : ''}</small></div>
      <div class="n" title="third-party hosts">${fmtN(s.third_party)}</div>
      <div class="n${s.trackers ? ' warn' : ''}" title="tracker hosts">${fmtN(s.trackers)}</div>
    </li>`).join('');
  for (const li of $('sites').querySelectorAll('li.row')) li.onclick = () => select(li.dataset.site);
}

const tags = (h) => (h.first_party || h.domain === state.site ? '<span class="tag fp">first party</span>' : '') + (h.tracker ? '<span class="tag">tracker</span>' : '');

// The report card: what a visit costs, by role and by company, from exact loads only.
function reportCard(c) {
  if (!c) return '';
  const segbar = (get, tall) => {
    const total = CLASSES.reduce((n, [k]) => n + get(k), 0) || 1;
    return `<div class="segbar${tall ? ' tall' : ''}">${CLASSES.filter(([k]) => get(k)).map(([k, l]) =>
      `<i class="c-${k}" style="width:${(100 * get(k) / total).toFixed(1)}%" title="${l}: ${tall ? fmtBytes(get(k)) : fmtN(get(k)) + ' requests'}">${tall && get(k) / total > 0.12 ? Math.round(100 * get(k) / total) + '%' : ''}</i>`).join('')}</div>`;
  };
  const third = c.bytes - c.by_class['first-party'].bytes;
  const trk = c.by_class.ads.bytes + c.by_class.telemetry.bytes;
  const clsTag = (k) => `<span class="tag cls"><i class="c-${k}"></i>${esc(CLASSES.find(([x]) => x === k)?.[1] ?? k)}</span>`;
  return `
    <h2>Report card <span class="muted">from ${fmtN(c.loads)} exact load${c.loads === 1 ? '' : 's'} · what a visit costs and who gets it</span></h2>
    <div class="tiles">
      <div class="tile"><div class="label">Per visit</div><div class="value">${fmtBytes(Math.round(c.bytes / c.loads))}</div><div class="sub muted">${fmtN(Math.round(c.requests / c.loads))} requests · ${c.span != null ? ms(c.span) : '–'}</div></div>
      <div class="tile"><div class="label">Third party</div><div class="value">${c.bytes ? Math.round(100 * third / c.bytes) : 0}%</div><div class="sub muted">of bytes · ${fmtBytes(third)} total</div></div>
      <div class="tile"><div class="label">Ads &amp; telemetry</div><div class="value${trk ? ' warn' : ''}">${fmtBytes(trk)}</div><div class="sub muted">${fmtN(c.by_class.ads.requests + c.by_class.telemetry.requests)} requests</div></div>
      <div class="tile"><div class="label">Own work done at</div><div class="value">${c.fp_done != null ? ms(c.fp_done) : '–'}</div><div class="sub muted">${c.trackers_until != null ? `trackers until ${ms(c.trackers_until)}` : 'no trackers'}</div></div>
    </div>
    <div class="legend">${CLASSES.map(([k, l]) => `<span><i class="c-${k}"></i>${l}</span>`).join('')}</div>
    <div class="chart"><div class="muted" style="font-size:11px;margin-bottom:3px">by requests</div>${segbar((k) => c.by_class[k].requests, false)}
      <div class="muted" style="font-size:11px;margin:8px 0 3px">by bytes</div>${segbar((k) => c.by_class[k].bytes, true)}</div>
    <div class="cols">
      <div><h2>Who gets the bytes</h2>${rows(c.companies.slice(0, 12), [
        { h: 'company', f: (r) => `<a href="/companies#${encodeURIComponent(r.org)}">${esc(r.org)}</a>` },
        { h: 'bytes', n: true, f: (r) => fmtBytes(r.bytes) }, { h: 'reqs', n: true, f: (r) => fmtN(r.requests) },
        { h: 'as', f: (r) => r.classes.map(clsTag).join(' ') }], 'None.')}</div>
      <div><h2>Request types</h2>${rows(c.types, [{ h: 'type', f: (r) => esc(r.type) }, { h: 'reqs', n: true, f: (r) => fmtN(r.requests) }, { h: 'bytes', n: true, f: (r) => fmtBytes(r.bytes) }], 'None.')}</div>
      <div><h2>Visits</h2>${rows(c.per_load.slice(0, 12), [
        { h: 'when', f: (r) => `<span style="white-space:nowrap">${new Date(r.start * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>` }, { h: 'bytes', n: true, f: (r) => fmtBytes(r.bytes) },
        { h: '3rd party', n: true, f: (r) => (r.bytes ? Math.round(100 * r.third_party_bytes / r.bytes) + '%' : '–') },
        { h: 'trk', n: true, f: (r) => fmtN(r.trackers) }, { h: 'done', n: true, f: (r) => (r.fp_done != null ? ms(r.fp_done) : '–') }], 'None.')}</div>
    </div>`;
}

// Gantt of one load: every request as a bar from start to end (a tick when the end is unknown),
// grouped by company, colored by what the host is to the site. Heuristic loads only know when each
// host first appeared, so they draw ticks; exact loads from the extension draw full bars.
function gantt(load) {
  if (!load) return '<div class="muted">No load recorded.</div>';
  const rowsIn = load.requests?.length ? load.requests : load.hits.map((h) => ({ name: h.name, offset: h.offset, end_offset: h.end_offset ?? null, type: h.type ?? null, status: h.status ?? null, bytes: h.bytes ?? null, cached: false, org: h.org, cls: h.cls }));
  const span = Math.max(0.25, ...rowsIn.map((r) => r.end_offset ?? r.offset));
  const pct = (s) => (100 * s / span).toFixed(2) + '%';
  const groups = new Map();
  for (const r of rowsIn) { const k = r.org ?? 'Unknown network'; (groups.get(k) ?? groups.set(k, []).get(k)).push(r); }
  const ordered = [...groups].sort((a, b) => Math.min(...a[1].map((r) => r.offset)) - Math.min(...b[1].map((r) => r.offset)));
  const lastOf = (pred) => Math.max(0, ...rowsIn.filter(pred).map((r) => r.end_offset ?? r.offset));
  const fpDone = lastOf((r) => r.cls === 'first-party'), trackersUntil = lastOf((r) => r.cls === 'ads' || r.cls === 'telemetry');
  const bytes = rowsIn.reduce((n, r) => n + (r.bytes ?? 0), 0);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span style="left:${(100 * f).toFixed(0)}%">${ms(span * f)}</span>`).join('');
  const bar = (r) => {
    const cls = `c-${r.cls ?? 'other'}`;
    const title = `${r.name} · ${r.type ?? ''}${r.status != null ? ` · ${r.status || 'failed'}` : ''}${r.bytes != null ? ` · ${fmtBytes(r.bytes)}` : ''}${r.cached ? ' · cached' : ''} · +${ms(r.offset)}${r.end_offset != null ? ` → +${ms(r.end_offset)} (${ms(r.end_offset - r.offset)})` : ' · end unknown'}`;
    const shape = r.end_offset != null
      ? `<i class="${cls}" style="left:${pct(r.offset)};width:${pct(Math.max(0.004 * span, r.end_offset - r.offset))}"></i>`
      : `<i class="${cls} tick" style="left:${pct(r.offset)}"></i>`;
    return `<div class="r" title="${esc(title)}"><div class="h">${esc(r.name)}<small>${esc(r.type ?? '')}${r.bytes != null ? ' · ' + fmtBytes(r.bytes) : ''}</small></div><div class="track">${shape}</div><div class="ms">${r.end_offset != null ? ms(r.end_offset - r.offset) : '+' + ms(r.offset)}</div></div>`;
  };
  return `
    <div class="sum"><b>${when(load.start)}</b> · ${esc(nm.appName(load.app))} · ${fmtN(rowsIn.length)} request${rowsIn.length === 1 ? '' : 's'} to ${fmtN(load.hits.length)} hosts over <b>${ms(span)}</b>${bytes ? ` · ${fmtBytes(bytes)}` : ''}
      ${load.exact ? '<span class="tag fp">exact</span>' : '<span class="tag cls">heuristic · first appearance only</span>'}
      ${fpDone ? ` · first party done at <b>${ms(fpDone)}</b>` : ''}${trackersUntil ? ` · trackers and telemetry until <b>${ms(trackersUntil)}</b>` : ''}</div>
    <div class="legend">${CLASSES.map(([k, l]) => `<span><i class="c-${k}"></i>${l}</span>`).join('')}</div>
    <div class="gantt">
      <div class="ruler"><span>company / host</span><div class="ticks">${ticks}</div><span style="text-align:right">took</span></div>
      ${ordered.map(([org, rs]) => {
        const s = Math.min(...rs.map((r) => r.offset)), e = Math.max(...rs.map((r) => r.end_offset ?? r.offset));
        const gb = rs.reduce((n, r) => n + (r.bytes ?? 0), 0);
        return `<div class="grp"><div class="org">${esc(org)}<small>${rs.length} request${rs.length === 1 ? '' : 's'}${gb ? ' · ' + fmtBytes(gb) : ''}</small></div><div class="track"><i style="left:${pct(s)};width:${pct(Math.max(0.004 * span, e - s))}"></i></div><div class="ms">${ms(e - s)}</div></div>` + rs.map(bar).join('');
      }).join('')}
    </div>`;
}

// Sites left, companies right, one ribbon per (site, company) pair, width = third-party hosts.
function renderGraph() {
  const g = state.graph;
  if (!g) { $('main').innerHTML = '<div class="empty">Loading…</div>'; return; }
  if (!g.sites.length) { $('main').innerHTML = '<div class="empty">No site loads with third-party hosts in this window.</div>'; return; }
  const ROW = 26, W = 960, LX = 230, RX = 730, PAD = 14;
  const H = Math.max(g.sites.length, g.orgs.length) * ROW + PAD * 2;
  const ys = (list) => { const off = (H - list.length * ROW) / 2 + PAD; return new Map(list.map((x, i) => [x.site ?? x.org, off + i * ROW])); };
  const sy = ys(g.sites), oy = ys(g.orgs);
  const maxE = Math.max(1, ...g.edges.map((e) => e.hosts));
  const tracker = new Set(g.orgs.filter((o) => o.tracker).map((o) => o.org));
  const ribbons = g.edges.map((e) => {
    const y1 = sy.get(e.site), y2 = oy.get(e.org), w = 1.5 + 9 * Math.sqrt(e.hosts / maxE), mx = (LX + RX) / 2;
    return `<path class="${tracker.has(e.org) ? 't' : ''}" data-site="${esc(e.site)}" data-org="${esc(e.org)}" stroke-width="${w.toFixed(1)}" d="M${LX + 8},${y1} C${mx},${y1} ${mx},${y2} ${RX - 8},${y2}"><title>${esc(e.site)} → ${esc(e.org)} · ${fmtN(e.hosts)} host${e.hosts === 1 ? '' : 's'}: ${esc(e.names.slice(0, 8).join(', '))}${e.names.length > 8 ? '…' : ''}</title></path>`;
  }).join('');
  const sites = g.sites.map((s) => `<g class="site" data-site="${esc(s.site)}"><rect class="node" x="${LX + 2}" y="${sy.get(s.site) - 7}" width="6" height="14"/><text x="${LX - 6}" y="${sy.get(s.site) + 4}" text-anchor="end">${esc(s.label)}</text><text class="n" x="4" y="${sy.get(s.site) + 4}">${fmtN(s.third_party)}</text></g>`).join('');
  const orgs = g.orgs.map((o) => `<g class="org" data-org="${esc(o.org)}"><rect class="node${o.tracker ? ' t' : ''}" x="${RX - 8}" y="${oy.get(o.org) - 7}" width="6" height="14"/><text x="${RX + 6}" y="${oy.get(o.org) + 4}">${esc(o.org)}</text><text class="n" x="${W - 4}" y="${oy.get(o.org) + 4}" text-anchor="end">${fmtN(o.sites)}</text></g>`).join('');
  $('main').innerHTML = `
    <div class="head"><h3>Who sees your browsing</h3><span class="muted">third-party companies behind the ${fmtN(g.sites.length)} sites with the biggest footprint</span>
      <button class="btn small" id="graph-table" style="margin-left:auto">${state.table ? 'Graph' : 'Table'}</button></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>third party</span><span><i style="background:var(--warn)"></i>includes a tracker</span><span class="muted">· ribbon width = hosts · left number = third-party hosts, right = sites · hover a ribbon, click a site</span></div>
    ${state.table ? `<div class="graph-table">${rows(g.edges, [
      { h: 'site', f: (e) => esc(g.sites.find((s) => s.site === e.site)?.label ?? e.site) },
      { h: 'company', f: (e) => esc(e.org) + (tracker.has(e.org) ? '<span class="tag">tracker</span>' : '') },
      { h: 'hosts', n: true, f: (e) => fmtN(e.hosts) },
      { h: 'names', f: (e) => esc(e.names.join(', ')) },
    ], 'Nothing.')}</div>`
    : `<div class="graph" id="graph"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="sites and the companies serving their third-party hosts">${ribbons}${sites}${orgs}</svg></div>`}
    <p class="note">Each site on the left pulled in hosts run by the companies on the right during its loads in this window.
      First-party hosts are left out.${g.orgs.some((o) => o.org === 'Other') ? ` Companies past the top ${fmtN(g.orgs.length - 1)} fold into Other.` : ''}
      Pick a site from the list for its full trace.</p>`;
  $('graph-table').onclick = () => { state.table = !state.table; renderGraph(); };
  const svg = $('graph')?.querySelector('svg');
  if (!svg) return;
  const hi = (key, val) => {
    svg.parentElement.classList.toggle('dim', !!val);
    for (const p of svg.querySelectorAll('path')) p.classList.toggle('hi', !!val && p.dataset[key] === val);
  };
  for (const gEl of svg.querySelectorAll('g.site, g.org')) {
    const key = gEl.dataset.site ? 'site' : 'org';
    gEl.onmouseenter = () => hi(key, gEl.dataset[key]);
    gEl.onmouseleave = () => hi(key, null);
    if (key === 'site') gEl.onclick = () => select(gEl.dataset.site);
  }
  for (const p of svg.querySelectorAll('path')) {
    p.onmouseenter = () => { svg.parentElement.classList.add('dim'); p.classList.add('hi'); };
    p.onmouseleave = () => { svg.parentElement.classList.remove('dim'); p.classList.remove('hi'); };
  }
}

function renderDetail() {
  const d = state.detail;
  if (!d) { renderGraph(); return; }
  const s = d.summary;
  $('main').innerHTML = `
    <div class="head"><button class="btn small" id="back" title="Back to the dependency graph">← all sites</button><h3>${esc(s.label)}${s.label !== s.site ? ` <span class="muted">${esc(s.site)}</span>` : ''}</h3>${d.pinned ? '<span class="tag fp">pinned</span>' : ''}
      <button class="btn small" id="pin-site" title="${d.pinned ? 'Stop treating this as a site you visit' : 'Always treat this as a site you visit, even mid-burst'}">${d.pinned ? 'Unpin' : 'Pin as site'}</button></div>
    <div class="muted">${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'} from ${[...new Set(s.apps.map(nm.appName))].map(esc).join(', ')} · last ${ago(s.last)}${s.exact ? ` · <span class="tag fp" title="${fmtN(s.exact)} of ${fmtN(s.loads)} loads reported by the Chrome extension">${s.exact === s.loads ? 'exact' : `${fmtN(s.exact)} exact`}</span>` : ''}</div>
    <div class="tiles">
      <div class="tile"><div class="label">Hosts</div><div class="value">${fmtN(s.hosts)}</div></div>
      <div class="tile"><div class="label">Third-party hosts</div><div class="value">${fmtN(s.third_party)}</div></div>
      <div class="tile"><div class="label">Companies</div><div class="value">${fmtN(s.orgs)}</div></div>
      <div class="tile"><div class="label">Tracker hosts</div><div class="value${s.trackers ? ' warn' : ''}">${fmtN(s.trackers)}</div></div>
    </div>
    ${reportCard(state.card)}
    <h2>Trace <span class="muted">${state.load && state.loadStart ? 'the load you picked' : 'the richest recent load'} · pick another below</span></h2>
    ${gantt(state.load ?? d.latest)}
    <h2>Everything it pulls in <span class="muted">across ${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'}</span></h2>
    ${rows(d.hosts, [
      { h: 'host', f: (r) => esc(r.name) + tags(r) + (r.first_party || r.tracker ? '' : ` <button class="btn small pin" data-name="${esc(r.name)}" title="This is a site I visited, not something ${esc(s.site)} pulled in">site?</button>`) },
      { h: 'company', f: (r) => esc(r.org ?? '') },
      { h: 'country', f: (r) => esc(r.country ?? '') },
      { h: 'in loads', n: true, f: (r) => `${fmtN(r.loads)}/${fmtN(s.loads)}` },
      { h: 'typical', n: true, f: (r) => '+' + ms(r.median_offset) },
    ], 'Nothing.')}
    <h2>Companies</h2>
    ${rows(d.orgs, [
      { h: 'company', f: (r) => esc(r.org) + (r.tracker ? '<span class="tag">tracker</span>' : '') },
      { h: 'hosts', n: true, f: (r) => fmtN(r.hosts) },
    ], 'Nothing.')}
    <h2>Loads <span class="muted">click one to trace it</span></h2>
    <div class="loadpick">${rows(d.loads.slice(0, 40), [
      { h: 'when', f: (r) => `<span data-start="${r.start}">${when(r.start)}</span>` },
      { h: 'app', f: (r) => esc(nm.appName(r.app)) },
      { h: 'took', n: true, f: (r) => ms(r.span) },
      { h: 'hosts', n: true, f: (r) => fmtN(r.hosts) },
      { h: 'trackers', n: true, f: (r) => fmtN(r.trackers) },
      { h: '', f: (r) => (r.exact ? '<span class="tag fp">exact</span>' : '') },
    ], 'Nothing.')}</div>
    <p class="note">A load is a burst of new connections from one app (3 s of quiet or 20 s ends it, and a www. or apex host
      of another site, or a pinned site, starts a new one); the site is the first name in the burst that is not a tracker,
      browser plumbing, a CDN or a bare IP. Connections a browser kept open from an earlier visit do not reappear, so a revisit
      can show fewer hosts or be rooted at its first new third party. If a host listed here is really a site you visited,
      mark it with <em>site?</em> and its loads split out from now on.</p>`;
  const pin = async (name, pinned) => {
    await fetch('/api/sites/known', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, pinned }) });
    await refresh();
  };
  $('back').onclick = () => { state.site = null; history.replaceState(null, '', ' '); refresh(); };
  $('pin-site').onclick = () => pin(s.site, !d.pinned);
  for (const tr of $('main').querySelectorAll('.loadpick tbody tr')) {
    const start = Number(tr.querySelector('[data-start]')?.dataset.start);
    if (state.loadStart === start) tr.classList.add('sel');
    tr.onclick = async () => {
      state.loadStart = start;
      state.load = await fetch(`/api/sites/${encodeURIComponent(s.site)}/load/${start}?since=${encodeURIComponent(state.win)}`).then((r) => (r.ok ? r.json() : null));
      renderDetail();
      $('main').scrollTo({ top: 0, behavior: 'smooth' });
    };
  }
  for (const b of $('main').querySelectorAll('button.pin')) b.onclick = () => pin(b.dataset.name, true);
}

async function select(site) {
  state.site = site; state.load = null; state.loadStart = null;
  history.replaceState(null, '', `#${encodeURIComponent(site)}`);
  await refresh();
}

async function refresh() {
  const q = `since=${encodeURIComponent(state.win)}`;
  const [list, detail, card, graph] = await Promise.all([
    fetch(`/api/sites?${q}`).then((r) => r.json()),
    state.site ? fetch(`/api/sites/${encodeURIComponent(state.site)}?${q}`).then((r) => (r.ok ? r.json() : null)) : null,
    state.site ? fetch(`/api/sites/${encodeURIComponent(state.site)}/card?${q}`).then((r) => (r.ok ? r.json() : null)) : null,
    state.site ? state.graph : fetch(`/api/sites/graph?${q}`).then((r) => r.json()),
    fetch('/api/browser/status').then((r) => r.json()).then(showExt).catch(() => {}),
  ]);
  state.list = list; state.detail = detail; state.card = card; state.graph = graph;
  renderList(); renderDetail();
}

nm.segment($('window'), state.win, (w) => { state.win = w; refresh(); });
$('filter').oninput = () => { state.q = $('filter').value.trim(); renderList(); };
state.site = decodeURIComponent(location.hash.slice(1)) || null;
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
