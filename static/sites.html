<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netmap · site traces</title>
<script>try{const t=localStorage.getItem('nm-theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  .list li.row { grid-template-columns: 1fr 40px 40px; }
  input.filter { margin-top: 10px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tiles { margin: 16px 0; max-width: 760px; }
  /* waterfall: one row per host, a bar from 0 to its offset within the load */
  .wf { max-width: 860px; margin-top: 6px; }
  .wf .r { display: grid; grid-template-columns: 280px 1fr 56px; align-items: center; gap: 10px; padding: 2px 4px; border-radius: 4px; }
  .wf .r:hover { background: var(--panel-2); }
  .wf .h { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf .h small { color: var(--dim); margin-left: 6px; }
  .wf .track { position: relative; height: 10px; }
  .wf .bar { position: absolute; left: 0; top: 1px; height: 8px; border-radius: 4px; background: var(--accent); min-width: 3px; }
  .wf .bar.t { background: var(--warn); }
  .wf .bar.fp { background: var(--text); }
  .wf .ms { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 11px; margin: 6px 0 2px; }
  .legend i { display: inline-block; width: 10px; height: 8px; border-radius: 4px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header id="nav"></header>
<div class="shell">
<aside>
  <h1>Site traces</h1>
  <div class="sub">What loading a site pulls in</div>
  <div class="seg wide" id="window">
    <button data-w="1h">1h</button><button data-w="24h">24h</button>
    <button data-w="7d">7d</button><button data-w="all">All</button>
  </div>
  <input class="filter" id="filter" type="search" placeholder="Filter sites…">
  <h2>Sites <span class="muted" id="count"></span></h2>
  <ul class="list" id="sites"><li class="muted">Loading…</li></ul>
</aside>
<main id="main"><div class="empty">Pick a site.</div></main>
</div>

<script>
const { esc, fmtN, ago, ms, rows } = nm;
const when = (ts) => nm.when(ts, true);
const $ = (id) => document.getElementById(id);
const state = { win: '24h', site: null, list: [], detail: null, q: '' };
nm.nav('/sites');
nm.stream();

function renderList() {
  const q = state.q.toLowerCase();
  const list = state.list.filter((s) => !q || s.site.includes(q) || s.label.includes(q));
  $('count').textContent = list.length ? `(${list.length})` : '';
  if (!list.length) { $('sites').innerHTML = '<li class="muted">No loads in this window.</li>'; return; }
  $('sites').innerHTML = list.map((s) => `
    <li class="row${s.site === state.site ? ' sel' : ''}" data-site="${esc(s.site)}">
      <div class="name" title="${esc(s.site)}">${esc(s.label)}<small>${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'} · ${ago(s.last)}</small></div>
      <div class="n" title="third-party hosts">${fmtN(s.third_party)}</div>
      <div class="n${s.trackers ? ' warn' : ''}" title="tracker hosts">${fmtN(s.trackers)}</div>
    </li>`).join('');
  for (const li of $('sites').querySelectorAll('li.row')) li.onclick = () => select(li.dataset.site);
}

const tags = (h) => (h.first_party || h.domain === state.site ? '<span class="tag fp">first party</span>' : '') + (h.tracker ? '<span class="tag">tracker</span>' : '');

function waterfall(load) {
  if (!load) return '<div class="muted">No load recorded.</div>';
  const span = Math.max(0.25, ...load.hits.map((h) => h.offset));
  return `
    <div class="muted">${when(load.start)} · ${esc(load.app)} · ${fmtN(load.hits.length)} hosts over ${ms(load.end - load.start)}</div>
    <div class="legend"><span><i style="background:var(--text)"></i>first party</span><span><i style="background:var(--accent)"></i>third party</span><span><i style="background:var(--warn)"></i>tracker</span></div>
    <div class="wf">${load.hits.map((h) => `
      <div class="r" title="${esc(h.name)} · ${esc(h.org ?? 'unknown org')} · ${esc(h.country ?? '')} · +${ms(h.offset)}">
        <div class="h">${esc(h.name)}<small>${esc(h.org ?? '')}</small></div>
        <div class="track"><div class="bar${h.tracker ? ' t' : h.domain === load.site ? ' fp' : ''}" style="width:${Math.max(0.6, (100 * h.offset) / span).toFixed(1)}%"></div></div>
        <div class="ms">+${ms(h.offset)}</div>
      </div>`).join('')}</div>`;
}

function renderDetail() {
  const d = state.detail;
  if (!d) { $('main').innerHTML = '<div class="empty">Pick a site.</div>'; return; }
  const s = d.summary;
  $('main').innerHTML = `
    <div class="head"><h3>${esc(s.label)}${s.label !== s.site ? ` <span class="muted">${esc(s.site)}</span>` : ''}</h3>${d.pinned ? '<span class="tag fp">pinned</span>' : ''}
      <button class="btn small" id="pin-site" title="${d.pinned ? 'Stop treating this as a site you visit' : 'Always treat this as a site you visit, even mid-burst'}">${d.pinned ? 'Unpin' : 'Pin as site'}</button></div>
    <div class="muted">${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'} from ${s.apps.map(esc).join(', ')} · last ${ago(s.last)}</div>
    <div class="tiles">
      <div class="tile"><div class="label">Hosts</div><div class="value">${fmtN(s.hosts)}</div></div>
      <div class="tile"><div class="label">Third-party hosts</div><div class="value">${fmtN(s.third_party)}</div></div>
      <div class="tile"><div class="label">Companies</div><div class="value">${fmtN(s.orgs)}</div></div>
      <div class="tile"><div class="label">Tracker hosts</div><div class="value${s.trackers ? ' warn' : ''}">${fmtN(s.trackers)}</div></div>
    </div>
    <h2>Latest load</h2>
    ${waterfall(d.latest)}
    <h2>Everything it pulls in <span class="muted">across ${fmtN(s.loads)} load${s.loads === 1 ? '' : 's'}</span></h2>
    ${rows(d.hosts, [
      { h: 'host', f: (r) => esc(r.name) + tags(r) + (r.first_party || r.tracker ? '' : ` <button class="btn small pin" data-name="${esc(r.name)}" title="This is a site I visited, not something ${esc(s.site)} pulled in">site?</button>`) },
      { h: 'company', f: (r) => esc(r.org ?? '') },
      { h: 'country', f: (r) => esc(r.country ?? '') },
      { h: 'in loads', n: true, f: (r) => `${fmtN(r.loads)}/${fmtN(s.loads)}` },
      { h: 'typical', n: true, f: (r) => '+' + ms(r.median_offset) },
    ], 'Nothing.')}
    <h2>Companies</h2>
    ${rows(d.orgs, [
      { h: 'company', f: (r) => esc(r.org) + (r.tracker ? '<span class="tag">tracker</span>' : '') },
      { h: 'hosts', n: true, f: (r) => fmtN(r.hosts) },
    ], 'Nothing.')}
    <h2>Loads</h2>
    ${rows(d.loads.slice(0, 40), [
      { h: 'when', f: (r) => when(r.start) },
      { h: 'app', f: (r) => esc(r.app) },
      { h: 'hosts', n: true, f: (r) => fmtN(r.hosts) },
      { h: 'trackers', n: true, f: (r) => fmtN(r.trackers) },
    ], 'Nothing.')}
    <p class="note">A load is a burst of new connections from one app (3 s of quiet or 20 s ends it, and a www. or apex host
      of another site, or a pinned site, starts a new one); the site is the first name in the burst that is not a tracker,
      browser plumbing, a CDN or a bare IP. Connections a browser kept open from an earlier visit do not reappear, so a revisit
      can show fewer hosts or be rooted at its first new third party. If a host listed here is really a site you visited,
      mark it with <em>site?</em> and its loads split out from now on.</p>`;
  const pin = async (name, pinned) => {
    await fetch('/api/sites/known', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, pinned }) });
    await refresh();
  };
  $('pin-site').onclick = () => pin(s.site, !d.pinned);
  for (const b of $('main').querySelectorAll('button.pin')) b.onclick = () => pin(b.dataset.name, true);
}

async function select(site) {
  state.site = site;
  history.replaceState(null, '', `#${encodeURIComponent(site)}`);
  await refresh();
}

async function refresh() {
  const q = `since=${encodeURIComponent(state.win)}`;
  const [list, detail] = await Promise.all([
    fetch(`/api/sites?${q}`).then((r) => r.json()),
    state.site ? fetch(`/api/sites/${encodeURIComponent(state.site)}?${q}`).then((r) => (r.ok ? r.json() : null)) : null,
  ]);
  state.list = list; state.detail = detail;
  renderList(); renderDetail();
}

nm.segment($('window'), state.win, (w) => { state.win = w; refresh(); });
$('filter').oninput = () => { state.q = $('filter').value.trim(); renderList(); };
state.site = decodeURIComponent(location.hash.slice(1)) || null;
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
