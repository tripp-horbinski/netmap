<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netmap · map</title>
<script>try{const t=localStorage.getItem('nm-theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  .shell aside { width: 340px; }
  #map { flex: 1; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat small { color: var(--dim); }
  .list li.row { grid-template-columns: auto 1fr auto; }
  .pop h3 { margin: 0 0 6px; font-size: 13px; }
  .pop table { border-collapse: collapse; width: 100%; max-width: none; }
  .pop td { padding: 2px 6px 2px 0; vertical-align: top; font-size: 12px; border: 0; }
  .pop tr:hover td { background: none; }
  .pop td.h { max-width: 220px; overflow-wrap: anywhere; }
  .world-btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
               padding: 5px 10px; font: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .world-btn:hover { border-color: var(--accent); }
  .route li { display: grid; grid-template-columns: 18px 1fr 52px; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
  .route li b { color: var(--text); font-weight: 500; }
  .route li .ms { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .route li.silent { opacity: .6; }
  .route .sum { margin: 4px 0 6px; }
  .reset { margin-top: 24px; }
</style>
</head>
<body>
<header id="nav"></header>
<div class="shell">
<aside>
  <h1>Map</h1>
  <div class="sub" id="home">Where this laptop is calling</div>
  <div class="stats">
    <div class="stat"><b id="s-dest">0</b><small>destinations</small></div>
    <div class="stat"><b id="s-proc">0</b><small>apps</small></div>
    <div class="stat"><b id="s-live">0</b><small>live now</small></div>
  </div>
  <div class="choro" id="choro" style="display:none"><span>1</span><i></i><span id="choro-max"></span><span>destinations by country</span></div>
  <div class="seg wide" id="window">
    <button data-w="live">Live</button><button data-w="900">15m</button>
    <button data-w="3600">1h</button><button data-w="all" class="on">All</button>
  </div>

  <div id="route-box" style="display:none">
    <h2>Route <span class="muted" id="route-title"></span> <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· bar = round trip</span> <button class="btn small" id="route-clear">clear</button></h2>
    <div class="route"><div class="sum muted" id="route-sum"></div><ul class="list" id="route"></ul></div>
  </div>

  <h2>Live <span class="muted" id="rate"></span></h2>
  <ul class="list feed" id="live"><li class="muted">Waiting for new connections…</li></ul>

  <h2>Apps <span class="muted" id="proc-hint"></span></h2>
  <ul class="list" id="procs"></ul>

  <h2>Who they talk to</h2>
  <ul class="list bars" id="orgs"></ul>

  <h2>Newest destinations</h2>
  <ul class="list feed" id="feed"></ul>

  <h2>No location</h2>
  <div class="muted" id="unknown">–</div>

  <button class="btn quiet reset" id="reset">Clear history</button>
</aside>
<div id="map"></div>
</div>

<script>
const { esc, color, token } = nm;
const ago = (sec) => nm.ago(Date.now() / 1000 - Math.max(0, sec));
nm.nav('/map');
const state = { data: null, win: 'all', proc: null };
const layers = new Map();   // location key -> { marker, arc }
let homeMarker = null;

// Whole-world view: one copy of the world, filling the window, no panning off the edge.
const WORLD = [[-58, -180], [78, 180]];
const map = L.map('map', {
  zoomControl: false, zoomSnap: 0.1, zoomDelta: 0.5,
  maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1,
});
function showWorld() {
  map.setMinZoom(0);
  map.fitBounds(WORLD, { animate: false });
  map.setMinZoom(map.getZoom());
}
showWorld();
window.addEventListener('resize', () => { map.invalidateSize(); showWorld(); });
L.control.zoom({ position: 'topright' }).addTo(map);
const WorldButton = L.Control.extend({
  onAdd() {
    const b = L.DomUtil.create('button', 'world-btn');
    b.textContent = 'World';
    b.title = 'Show the whole world';
    L.DomEvent.on(b, 'click', e => { L.DomEvent.stop(e); showWorld(); });
    return b;
  },
});
new WorldButton({ position: 'topright' }).addTo(map);
// Countries drawn locally from Natural Earth (no tile server, no API key, no third-party requests).
map.attributionControl.addAttribution('<a href="https://www.naturalearthdata.com/">Natural Earth</a> · <a href="https://db-ip.com">IP Geolocation by DB-IP</a>');
map.createPane('countries').style.zIndex = 200;
fetch('vendor/countries-110m.json').then(r => r.json()).then(topo => {
  const world = topojson.feature(topo, topo.objects.countries);
  // Drop Antarctica, and unwrap rings that cross the 180° line (Russia, Fiji) so they
  // don't draw as stripes across the whole map.
  world.features = world.features.filter(f => f.properties.name !== 'Antarctica');
  const unwrap = ring => {
    for (let i = 1; i < ring.length; i++) {
      const d = ring[i][0] - ring[i - 1][0];
      if (d > 180) ring[i][0] -= 360; else if (d < -180) ring[i][0] += 360;
    }
  };
  for (const f of world.features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    polys.forEach(p => p.forEach(unwrap));
  }
  countries = L.geoJSON(world, { pane: 'countries', style: landStyle(),
    onEachFeature: (f, l) => l.bindTooltip('', { sticky: true, direction: 'top', className: 'choro-tip' }) }).addTo(map);
  render();
});
// Shade each country by how many destinations in the window sit inside it: one hue, land -> accent.
function shadeCountries(conns) {
  if (!countries) return;
  const ips = new Map();
  for (const c of conns) { const k = nm.countryKey(c.country); if (k) (ips.get(k) ?? ips.set(k, new Set()).get(k)).add(c.ip); }
  const max = Math.max(1, ...[...ips.values()].map((s) => s.size));
  countries.eachLayer((l) => {
    const n = ips.get(l.feature.properties.name)?.size ?? 0;
    l.setStyle({ ...landStyle(), fillColor: nm.choroFill(n, max) });
    l.setTooltipContent(n ? `${esc(l.feature.properties.name)} · ${n} destination${n === 1 ? '' : 's'}` : '');
    l.options.interactive = n > 0;
    l.getElement()?.classList.toggle('leaflet-interactive', n > 0);
  });
  const legend = document.getElementById('choro');
  legend.style.display = ips.size ? '' : 'none';
  legend.querySelector('i').style.background = `linear-gradient(90deg, ${nm.choroFill(1, max)}, ${nm.choroFill(max, max)})`;
  document.getElementById('choro-max').textContent = max;
}
let countries = null;
const landStyle = () => ({ color: token('--map-border'), weight: 0.7, fillColor: token('--map-land'), fillOpacity: 1 });
window.addEventListener('nm:theme', () => {
  countries?.setStyle(landStyle());
  homeMarker?.setStyle({ color: token('--panel'), fillColor: token('--accent') });
  for (const l of route.layers) l.setStyle(l instanceof L.Polyline ? { color: token('--map-ink') } : { color: token('--map-ink'), fillColor: token('--panel') });
  render(); renderLive();
});

function place(c) { return [c.city, c.region, c.country].filter(Boolean).join(', ') || 'Unknown'; }

// Curved arc from a to b as a quadratic Bézier sampled into points.
function arcPoints(a, b) {
  const [x1, y1, x2, y2] = [a[1], a[0], b[1], b[0]];
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
  const cx = (x1 + x2) / 2 - dy * 0.2, cy = (y1 + y2) / 2 + dx * 0.2;
  const pts = [];
  for (let t = 0; t <= 1.0001; t += 0.05) {
    const u = 1 - t;
    pts.push([u*u*y1 + 2*u*t*cy + t*t*y2, u*u*x1 + 2*u*t*cx + t*t*x2]);
  }
  return pts;
}

function render() {
  const d = state.data; if (!d) return;
  const liveSec = d.interval * 3 + 1;
  const win = state.win === 'live' ? liveSec : state.win === 'all' ? Infinity : +state.win;
  const isLive = c => d.now - c.last_seen <= liveSec;
  const inWin = d.connections.filter(c => d.now - c.last_seen <= win);
  // A filter on an app also covers everything launched from it, at any depth.
  const viaByName = nm.majorityVia(inWin);
  const under = (c) => { let v = c.process, hops = 0; while (v && hops++ < 8) { if (v === state.proc) return true; v = viaByName.get(v) ?? null; } return false; };
  const conns = state.proc ? inWin.filter(c => under(c)) : inWin;

  // Stats
  const ips = new Set(conns.map(c => c.ip));
  document.getElementById('s-dest').textContent = ips.size;
  document.getElementById('s-proc').textContent = new Set(inWin.map(c => c.process)).size;
  document.getElementById('s-live').textContent = new Set(conns.filter(isLive).map(c => c.ip)).size;
  document.getElementById('home').textContent = [d.home?.label, `names: ${d.sniffer}`].filter(Boolean).join(' · ');

  // Group by location
  const groups = new Map(); const unknown = [];
  for (const c of conns) {
    if (c.lat == null) { unknown.push(c); continue; }
    const key = `${c.lat.toFixed(2)},${c.lon.toFixed(2)}`;
    let g = groups.get(key);
    if (!g) groups.set(key, g = { lat: c.lat, lon: c.lon, place: place(c), conns: [], ips: new Set(), live: false, procs: {} });
    g.conns.push(c); g.ips.add(c.ip); g.live ||= isLive(c);
    g.procs[c.process] = (g.procs[c.process] || 0) + c.samples;
  }

  // Map layers: update in place so open popups survive refreshes.
  for (const [key, l] of layers) if (!groups.has(key)) { l.marker.remove(); l.arc?.remove(); layers.delete(key); }
  for (const [key, g] of groups) {
    const top = Object.entries(g.procs).sort((a, b) => b[1] - a[1])[0][0];
    const col = color(top);
    const radius = 4 + 3 * Math.sqrt(g.ips.size);
    const style = { color: col, fillColor: col, fillOpacity: g.live ? 0.85 : 0.35, opacity: g.live ? 1 : 0.5, weight: g.live ? 2 : 1 };
    let l = layers.get(key);
    if (!l) {
      l = { marker: L.circleMarker([g.lat, g.lon], { radius, ...style }).addTo(map).bindPopup('', { maxWidth: 420 }) };
      if (d.home) l.arc = L.polyline(arcPoints([d.home.lat, d.home.lon], [g.lat, g.lon]), { interactive: false }).addTo(map);
      layers.set(key, l);
    }
    l.marker.setRadius(radius).setStyle(style);
    l.arc?.setStyle({ color: col, weight: g.live ? 1.6 : 0.8, opacity: g.live ? 0.8 : 0.18, dashArray: g.live ? null : '3 5' });
    l.marker.setPopupContent(popup(g, isLive));
  }

  if (d.home && !homeMarker) {
    homeMarker = L.circleMarker([d.home.lat, d.home.lon], { radius: 6, color: token('--panel'), fillColor: token('--accent'), fillOpacity: 1, weight: 2 })
      .addTo(map).bindTooltip(d.home.label);
  }

  shadeCountries(conns);
  renderSidebar(inWin, conns, unknown, isLive, d.now);
}

function popup(g, isLive) {
  const byIp = new Map();
  for (const c of g.conns) {
    let r = byIp.get(c.ip);
    if (!r) byIp.set(c.ip, r = { ...c, procs: new Set(), ports: new Set(), live: false });
    r.procs.add(c.process); r.ports.add(`${c.port}/${c.proto}`); r.live ||= isLive(c);
  }
  const rows = [...byIp.values()].sort((a, b) => b.live - a.live || b.last_seen - a.last_seen).slice(0, 30);
  return `<div class="pop"><h3>${esc(g.place)} <span class="muted">· ${g.ips.size} IP${g.ips.size > 1 ? 's' : ''}</span></h3><table>` +
    rows.map(r => `<tr><td><span class="dot ${r.live ? 'live' : ''}" style="display:inline-block;background:${color([...r.procs][0])}"></span></td>
      <td class="h"><b>${esc(r.names[0] || r.hostname || r.ip)}</b>${r.names.length > 1 ? `<br>${r.names.slice(1).map(esc).join('<br>')}` : ''}<br><span class="muted">${esc(r.org || '')} · ${esc(r.ip)}${r.names.length && r.hostname ? ' · ' + esc(r.hostname) : ''}</span></td>
      <td>${[...r.procs].map(esc).join('<br>')}<br><span class="muted">${[...r.ports].map(esc).join(' ')}</span><br><button class="btn small" onclick="traceRoute('${esc(r.ip)}')">route</button></td></tr>`).join('') +
    `</table>${byIp.size > 30 ? `<div class="muted">…and ${byIp.size - 30} more</div>` : ''}</div>`;
}

function renderSidebar(inWin, conns, unknown, isLive, now) {
  // Apps (always from the unfiltered window so you can switch between them)
  const procs = new Map();
  for (const c of inWin) {
    let p = procs.get(c.process);
    if (!p) procs.set(c.process, p = { ips: new Set(), live: false });
    p.ips.add(c.ip); p.live ||= isLive(c);
  }
  document.getElementById('proc-hint').textContent = state.proc ? '· click again to show all' : '· click to filter';
  // CLI tools sit under the app that launched them (via); the parent row filters to the whole group.
  const row = (g, depth) =>
    `<li class="row ${depth ? 'sub' : ''} ${state.proc === g.name ? 'sel' : ''}" style="--d:${depth}" data-proc="${esc(g.name)}">
       <span class="dot ${g.live ? 'live' : ''}" style="background:${color(g.name)}"></span>
       <span class="name">${esc(g.name)}</span><span class="n">${g.n}</span></li>`;
  const viaOf = nm.majorityVia(inWin);
  const tree = nm.groupByVia([...procs].map(([name, p]) => ({ name, n: p.ips.size, live: p.live, via: viaOf.get(name) ?? null })));
  document.getElementById('procs').innerHTML = tree.map(([g, d]) => row(g, d)).join('') || '<li class="muted">Waiting for connections…</li>';

  // Orgs
  const orgs = new Map();
  for (const c of conns) {
    const k = c.org || 'Unknown network';
    if (!orgs.has(k)) orgs.set(k, new Set());
    orgs.get(k).add(c.ip);
  }
  const maxOrg = Math.max(1, ...[...orgs.values()].map(s => s.size));
  document.getElementById('orgs').innerHTML = [...orgs].sort((a, b) => b[1].size - a[1].size).slice(0, 12).map(([name, s]) =>
    `<li style="--w:${(100 * s.size / maxOrg).toFixed(1)}%"><span class="name">${esc(name)}</span><span class="n">${s.size}</span></li>`).join('');

  // Newest destinations
  const seen = new Map();
  for (const c of conns) if (!seen.has(c.ip) || c.first_seen < seen.get(c.ip).first_seen) seen.set(c.ip, c);
  document.getElementById('feed').innerHTML = [...seen.values()].sort((a, b) => b.first_seen - a.first_seen).slice(0, 12).map(c =>
    `<li><b>${esc(c.process)}</b> → ${esc(c.names[0] || c.org || c.hostname || c.ip)} <span>· ${esc(c.city || c.country || '?')} · ${ago(now - c.first_seen)}</span></li>`).join('');

  const unk = [...new Set(unknown.map(c => `${c.process} → ${c.ip}`))];
  document.getElementById('unknown').innerHTML = unk.length ? unk.slice(0, 20).map(esc).join('<br>') : 'None';
}

document.getElementById('procs').addEventListener('click', e => {
  const li = e.target.closest('[data-proc]'); if (!li) return;
  state.proc = state.proc === li.dataset.proc ? null : li.dataset.proc;
  render();
});
document.getElementById('window').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.win = b.dataset.w;
  document.querySelectorAll('#window button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('reset').addEventListener('click', async () => {
  if (!confirm('Clear all recorded connections?')) return;
  await fetch('/api/reset', { method: 'POST' });
  poll();
});

// --- real time: one message per connection open, pushed from the server --------
const live = nm.live.events;
let flashing = 0, pollTimer = null;
function schedulePoll() {
  if (!pollTimer) pollTimer = setTimeout(() => { pollTimer = null; poll(); }, 500);
}
function renderLive() {
  const now = Date.now() / 1000;
  const perMin = live.filter(e => now - e.ts < 60).length;
  document.getElementById('rate').textContent = live.length ? `· ${perMin}${perMin >= 30 ? '+' : ''} in the last minute` : '';
  if (!live.length) return;
  document.getElementById('live').innerHTML = live.slice(0, 8).map(e =>
    `<li data-id="${e.id}"${e === live[0] ? ' class="new"' : ''}><span class="dot" style="background:${color(e.app)}"></span>
       <span class="name"><b>${esc(e.app)}</b>${e.via ? ` <span class="muted">via ${esc(e.via)}</span>` : ''}${e.site ? ` · ${esc(e.site)}` : ''} → ${esc(e.host || e.org || e.ip)}</span>
       <span class="t">${ago(Math.max(0, now - e.ts))}</span></li>`).join('');
}
function flash(e) {
  const home = state.data?.home;
  if (e.lat == null || flashing > 25 || (state.proc && e.app !== state.proc && e.via !== state.proc)) return;
  flashing++;
  const col = color(e.app);
  let arc = null;
  if (home) {
    // Draw the arc from here to the destination, then fade it.
    arc = L.polyline(arcPoints([home.lat, home.lon], [e.lat, e.lon]), { color: col, weight: 2.5, opacity: 0.95, interactive: false }).addTo(map);
    const el = arc.getElement(), len = el.getTotalLength();
    el.style.strokeDasharray = `${len}`;
    el.style.strokeDashoffset = `${len}`;
    el.getBoundingClientRect();
    el.style.transition = 'stroke-dashoffset .7s ease-out, opacity .6s ease .9s';
    el.style.strokeDashoffset = '0';
    el.style.opacity = '0';
  }
  // Ripple at the destination as the arc lands.
  const ring = L.circleMarker([e.lat, e.lon], { radius: 3, color: col, weight: 2, fill: false, interactive: false }).addTo(map);
  const start = performance.now() + (home ? 600 : 0);
  const step = now => {
    const k = (now - start) / 900;
    if (k >= 1) { ring.remove(); arc?.remove(); flashing--; return; }
    if (k > 0) { ring.setRadius(3 + 22 * k); ring.setStyle({ opacity: 1 - k }); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// --- route traces: traceroute hops drawn as a path through the hops that geolocate -----------
const route = { layers: [], ip: null };
function clearRoute() {
  for (const l of route.layers) l.remove();
  route.layers = []; route.ip = null;
  document.getElementById('route-box').style.display = 'none';
}
async function traceRoute(ip, fresh = false) {
  clearRoute();
  route.ip = ip;
  const box = document.getElementById('route-box'), list = document.getElementById('route'), sum = document.getElementById('route-sum');
  box.style.display = ''; document.getElementById('route-title').textContent = ip;
  sum.textContent = 'tracing… (up to ~30 s)'; list.innerHTML = '';
  location.hash = `trace=${ip}`;
  let t;
  try { t = await (await fetch(`/api/trace/${encodeURIComponent(ip)}${fresh ? '?fresh=1' : ''}`)).json(); }
  catch (e) { sum.textContent = `trace failed: ${e}`; return; }
  if (route.ip !== ip) return;             // user started another trace meanwhile
  if (t.error) { sum.textContent = t.error; return; }
  const home = state.data?.home;
  const placed = t.hops.filter(h => h.lat != null);
  const pts = [...(home ? [[home.lat, home.lon]] : []), ...placed.map(h => [h.lat, h.lon])];
  if (pts.length >= 2) {
    const line = L.polyline(pts, { color: token('--map-ink'), weight: 2, opacity: 0.85, dashArray: '6 6', interactive: false }).addTo(map);
    route.layers.push(line);
    map.fitBounds(line.getBounds().pad(0.2));
  }
  for (const h of placed) {
    const m = L.circleMarker([h.lat, h.lon], { radius: 5, color: token('--map-ink'), fillColor: token('--panel'), fillOpacity: 1, weight: 2 }).addTo(map)
      .bindTooltip(`#${h.n} ${h.rdns || h.ip} · ${h.org || ''} · ${h.city ? h.city + ', ' : ''}${h.country || ''} · ${h.rtt_ms.toFixed(1)} ms`);
    route.layers.push(m);
  }
  const silent = t.hops.filter(h => !h.ip).length;
  const place = h => h.private ? 'private' : h.city ? `${h.city}, ${h.country}` : h.country || 'no location';
  sum.innerHTML = `${t.hops.length} hops · ${placed.length} on the map · ${silent} silent · ${t.seconds.toFixed(1)} s · ${t.reached ? 'reached' : t.truncated ? 'gave up before the end' : 'incomplete'} · ${tracedAgo(t.ts)} <button class="btn small" id="route-again">again</button>`;
  const maxRtt = Math.max(1, ...t.hops.map(h => h.rtt_ms ?? 0));
  list.innerHTML = t.hops.map(h => h.ip
    ? `<li style="--w:${(100 * h.rtt_ms / maxRtt).toFixed(1)}%" title="round trip ${h.rtt_ms.toFixed(1)} ms"><span>${h.n}</span><span><b>${esc(h.rdns || h.ip)}</b>${h.rdns ? `<br>${esc(h.ip)}` : ''}<br>${esc(h.org || '')}${h.org ? ' · ' : ''}${esc(place(h))}</span><span class="ms">${h.rtt_ms.toFixed(1)} ms</span></li>`
    : `<li class="silent"><span>${h.n}</span><span>no answer</span><span class="ms">–</span></li>`).join('');
  document.getElementById('route-again').onclick = () => traceRoute(ip, true);
}
document.getElementById('route-clear').onclick = () => { clearRoute(); history.replaceState(null, '', ' '); };
function tracedAgo(ts) { const s = Date.now() / 1000 - ts; return s < 90 ? 'just now' : s < 5400 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; }

nm.stream(e => { renderLive(); flash(e); schedulePoll(); });
setInterval(renderLive, 5000);

async function poll() {
  try {
    state.data = nm.aliasConnections(await (await fetch('/api/data')).json());
    const m = /^#trace=([0-9a-f.:]+)$/i.exec(location.hash);
    if (m && !route.ip) traceRoute(m[1]);
    render();
  } catch (e) { console.warn('poll failed', e); }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
